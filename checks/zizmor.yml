# zizmor configuration (https://docs.zizmor.sh/configuration/).
rules:
  adhoc-packages:
    ignore:
      # Fleet's own scaffold installs fleetctl with npm, pinned to the Fleet server's
      # exact version, which is how Fleet intends the action to work.
      - action.yml
  self-repository:
    # GitHub's `uses: $/...` syntax (July 2026) is not supported by actionlint 1.7.12 yet,
    # which rejects it as an invalid action reference. Keep `./...` until it is.
    disable: true
