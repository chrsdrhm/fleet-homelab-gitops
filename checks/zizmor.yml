# zizmor configuration (https://docs.zizmor.sh/configuration/).
rules:
  dangerous-triggers:
    ignore:
      # pull_request_target, as in Fleet's fleetctl new template: the workflow
      # and the action come from main, the pull request's YAML is checked out into
      # untrusted-pr/ and only read by fleetctl (never run), credentials aren't
      # persisted, and only this repository's own branches get a run.
      - workflow.yml
  self-repository:
    # GitHub's `uses: $/...` syntax isn't supported by the actionlint pinned in
    # install-tools.sh, which rejects it as an invalid action reference. Keep `./...`
    # until it is.
    disable: true
