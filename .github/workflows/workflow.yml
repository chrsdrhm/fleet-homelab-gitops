name: "Apply latest configuration to Fleet"

on:
  push:
    branches:
      - main
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 6 * * *" # Nightly 6AM UTC

# Prevent concurrent runs of this workflow.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Limit permissions of GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  fleet-gitops:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      ###########################################################
      # Is Fleet up? The homelab stack is torn down between sessions, and a
      # torn-down Fleet has nothing to reconcile, so any run then skips with a
      # warning instead of failing. Whatever is on main is applied by the run
      # that up.sh (infra repo) starts after the next rebuild.
      ###########################################################
      - name: Check that Fleet is reachable
        id: fleet
        env:
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_CI_HEADER: ${{ secrets.FLEET_CI_HEADER }}
          EVENT: ${{ github.event_name }}
        run: |
          # Pull requests from Dependabot or forks run without secrets, so there is no
          # server to dry-run against.
          if [ -z "${FLEET_URL}" ] && [ "$EVENT" = "pull_request" ]; then
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No secrets::This pull request runs without repository secrets (Dependabot or a fork), so the dry run is skipped."
            exit 0
          fi
          # x-fleet-ci lets this runner past the WAF's US-only rule (runners can be anywhere).
          code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -H "x-fleet-ci: ${FLEET_CI_HEADER}" "${FLEET_URL%/}/healthz" || true)
          if [ "$code" = "200" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "Fleet is up."
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Fleet is down::Skipped (HTTP $code): the stack is torn down. The run that up.sh starts after the next rebuild applies main."
          fi

      - name: Make github action script executable
        if: steps.fleet.outputs.up == 'true'
        run: chmod +x ./.github/fleet-gitops/gitops.sh

      - name: Apply latest configuration to Fleet
        if: steps.fleet.outputs.up == 'true'
        uses: ./.github/fleet-gitops
        with:
          # Run GitOps in dry-run mode for pull requests.
          dry-run-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

        # These environment variables can be set as repository secrets,
        # alongside any other environment variables mentioned in your .yml files.
        env:
          ###########################################################
          # The server URL where Fleet is running.
          #
          #   • No trailing slash at the end
          #   • `http://` or `https://` at the beginning.
          #
          # (You can copy this from the URL bar in your browser.)
          #
          # Warning: Careful not to change this URL after enrolling
          # Apple devices with MDM pointed at Fleet. If this URL changes
          # and Apple hosts already have MDM turned on, then end users
          # will have to take action to restore MDM functionality (due
          # to the way Apple's device management protocol works.)
          ###########################################################
          FLEET_URL: ${{ secrets.FLEET_URL && secrets.FLEET_URL || 'https://fleet.example.com' }}

          ###########################################################
          # A Fleet API token that your CI/CD builds will use
          # to sync changes to Fleet.
          #
          # (You can copy your API token from the Fleet user interface
          # by visiting "My account" > "Get API token".  Just remember,
          # that token has an expiration date, so you'll eventually want
          # to also follow the steps suggested on that screen to create
          # an API-only user with a permanent token that is longer lived
          # or that never expires.)
          ###########################################################
          FLEET_API_TOKEN: ${{ secrets.FLEET_API_TOKEN }}

          ###########################################################
          # Values the YAML files reference as $VARIABLES. None of these is ever
          # written into a file in this public repo.
          ###########################################################
          FLEET_OKTA_METADATA_URL: ${{ secrets.FLEET_OKTA_METADATA_URL }}
          FLEET_IDP_IMAGE_URL: ${{ secrets.FLEET_IDP_IMAGE_URL }}

          ###########################################################
          # Secret header that lets GitHub's runners (in any country) past the
          # Fleet WAF's US-only rule. Sent by the action on every request.
          ###########################################################
          FLEET_CI_HEADER: ${{ secrets.FLEET_CI_HEADER }}
