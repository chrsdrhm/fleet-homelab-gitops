name: fleetctl-gitops
description: Runs fleetctl gitops to apply configuration to Fleet

inputs:
  working-directory:
    description: 'The working directory, which should be the root of the repository.'
    default: './'
  dry-run-only:
    description: 'Whether to only run the fleetctl gitops commands in dry-run mode.'
    default: 'false'
  delete-other-fleets:
    description: 'Whether to delete any other fleets which exist in the database but are not defined as .yml.'
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Install fleetctl
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # github-env: the GITHUB_PATH write below appends the runner-controlled constant
      # $HOME/.fleetctl, not any user-supplied value, so it cannot inject a path.
      run: | # zizmor: ignore[github-env]
        FLEET_URL="$(printf '%s' "$FLEET_URL" | sed 's:/*$::')"
        FLEET_VERSION="$(curl "$FLEET_URL/api/v1/fleet/version" --header "Authorization: Bearer $FLEET_API_TOKEN" --header "x-fleet-ci: ${FLEET_CI_HEADER:-}" --fail --silent | jq --raw-output '.version')"

        # Decide which fleetctl version to install:
        # If the server returns a clean version (e.g. 4.74.0), use that.
        # A snapshot (e.g. 0.0.0-SNAPSHOT-xxxxx) or an unrecognised version fails the run.
        # Changed from the scaffold: an empty answer fails the run instead of installing
        # the newest fleetctl, which may not match the server.
        if [[ -z "$FLEET_VERSION" ]]; then
          echo "::error title=No Fleet version::Could not read the Fleet server's version, so the matching fleetctl cannot be chosen."
          exit 1
        elif [[ "$FLEET_VERSION" == 0.0.0-SNAPSHOT* ]]; then
          # Changed from the scaffold: a snapshot build has no release to match, so fail.
          echo "::error title=Snapshot Fleet::The server runs a snapshot build, which has no matching fleetctl release."
          exit 1
        elif [[ "$FLEET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          INSTALL_VERSION="$FLEET_VERSION"
        else
          # Strip anything after + (e.g. 4.81.0+foobar -> 4.81.0)
          FLEET_VERSION="${FLEET_VERSION%%\+*}"
          if [[ "$FLEET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            INSTALL_VERSION="$FLEET_VERSION"
          else
            echo "::error title=Unknown Fleet version::Could not match the server's version ($FLEET_VERSION) to a fleetctl release."
            exit 1
          fi
        fi

        echo "Installing fleetctl v$INSTALL_VERSION..."
        # Changed from the scaffold, which pipes fleetdm.com's install-fleetctl.sh into
        # bash: this step holds the API token, so it downloads exactly this release's
        # fleetctl archive from GitHub and checks it against the release's checksums.txt
        # before installing. No fallback to the latest release.
        case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64 | arm64) arch=arm64 ;; *) echo "::error::Unsupported CPU: $(uname -m)"; exit 1 ;; esac
        base="https://github.com/fleetdm/fleet/releases/download/fleet-v$INSTALL_VERSION"
        name="fleetctl_v${INSTALL_VERSION}_linux_${arch}"
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/$name.tar.gz" "$base/$name.tar.gz"
        curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
        (cd "$tmp" && grep " $name.tar.gz\$" checksums.txt | sha256sum --check --strict -)
        tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
        mkdir -p "$HOME/.fleetctl"
        install -m 0755 "$tmp/$name/fleetctl" "$HOME/.fleetctl/fleetctl"
        rm -rf "$tmp"
        echo "$HOME/.fleetctl" >> "$GITHUB_PATH"

    - name: Configure fleetctl
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Values come from the environment, not interpolated into the script. The custom
      # header (when set) is sent on every fleetctl request, to get past the WAF.
      run: |
        if [ -n "${FLEET_CI_HEADER:-}" ]; then
          fleetctl config set --address "$FLEET_URL" --token "$FLEET_API_TOKEN" --custom-header "x-fleet-ci:${FLEET_CI_HEADER}"
        else
          fleetctl config set --address "$FLEET_URL" --token "$FLEET_API_TOKEN"
        fi

    - name: Run fleetctl gitops commands
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FLEET_DRY_RUN_ONLY: ${{ inputs.dry-run-only }}
        FLEET_DELETE_OTHER_FLEETS: ${{ inputs.delete-other-fleets }}
      run: ./.github/fleet-gitops/gitops.sh
