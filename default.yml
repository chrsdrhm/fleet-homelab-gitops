# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#
# default.yml
#
# Use this global manifest (`default.yml`) to configure
# top-level settings for your organization as a whole, and
# controls/reports/etc that apply to all of your fleets.
#
# To see all supported options, check out:
#   • https://fleetdm.com/docs/configuration/yaml-files
#
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

org_settings:
  org_info:
    ###########################################################
    # The name of your organization is displayed to end users
    # during the setup experience for new hardware, and to admins
    # in the Fleet UI.
    #
    # Read more:
    #   • https://fleetdm.com/docs/configuration/yaml-files#org-info
    ###########################################################
    org_name: Homelab

  server_settings:
    ###########################################################
    # The server URL where Fleet is running.
    #
    # Note: This is configured as a repository "secret" just so
    # that it can be more easily used in the CI/CD workflow
    # configurations.
    ###########################################################
    server_url: $FLEET_URL

  ###########################################################
  # GitOps mode: Fleet's UI shows what this repo manages as read-only, with a
  # pointer to the repo. This file defines everything, so without it a change made
  # in the UI would be silently deleted by the next run. Exceptions (labels,
  # software, enroll secrets) are set in the UI, under Settings > Integrations >
  # Change management; see the README.
  #
  # Read more:
  #   • https://fleetdm.com/guides/gitops-mode
  ###########################################################
  gitops:
    gitops_mode_enabled: true
    repository_url: $FLEET_GITOPS_REPO_URL # this repository; the workflow sets it

  ###########################################################
  # Single sign-on (SSO) for admins accessing Fleet. Off: no identity provider is
  # connected, so Fleet's admins sign in with passwords. To connect one, set
  # enable_sso to true and add idp_name, idp_image_url, entity_id and metadata_url
  # (each a repository secret, as $VARIABLES).
  #
  # Read more:
  #   • https://fleetdm.com/docs/configuration/yaml-files#sso-settings
  #   • https://fleetdm.com/docs/deploy/single-sign-on-sso
  ###########################################################
  sso_settings:
    enable_sso: false
    enable_sso_idp_login: false # keep off: an unsolicited, IdP-initiated login drops Fleet's request-binding check

  # Enroll secrets are not set here: Fleet's change-management settings
  # exclude them from GitOps by default (`gitops.exceptions.secrets: true`), and a
  # `secrets:` key makes `fleetctl gitops` fail. They are managed in Fleet itself.

  mdm:
    ###########################################################
    # Single sign-on (SSO) to authenticate the person enrolling
    # a device, during end user setup: an identity provider app
    # separate from the admin one. Off: no identity provider is
    # connected. To connect one, add end_user_authentication with
    # idp_name, metadata_url (a repository secret) and entity_id,
    # and turn it on per fleet with
    # controls.setup_experience.enable_end_user_authentication.
    #
    # Read more:
    #   • https://fleetdm.com/docs/configuration/yaml-files#end-user-authentication
    #   • https://fleetdm.com/guides/setup-experience#require-idp-authentication
    ###########################################################

    ###########################################################
    # Uncomment when you are ready to start using zero-touch enrollment
    # for Apple devices via Apple Business (AB).
    #
    # Read more:
    #   • https://fleetdm.com/docs/configuration/yaml-files#apple-business-manager
    #   • https://fleetdm.com/guides/apple-mdm-setup#apple-business-manager-abm
    ###########################################################
    # apple_business:
    #   - organization_name: "My Company, Inc." # This must exactly match the organization name in Apple Business (AB).
    #     macos_fleet: "💻 Workstations" # Where new macOS devices from AB will appear

    ###########################################################
    # Uncomment to start using Apple's volume purchase program (VPP)
    # for making software available from the App Store and managing
    # software licenses.
    #
    # Read more:
    #   • https://fleetdm.com/docs/configuration/yaml-files#volume-purchasing-program
    #   • https://fleetdm.com/guides/apple-mdm-setup#volume-purchasing-program-vpp
    ###########################################################
    # volume_purchasing_program:
    #   - location: "My organization unit." # This must exactly match an "Organization Unit" name in Apple Business (AB). Apple previously called this "location." Fleet will rename it to "organization unit" in the next major version.
    #     fleets:
    #       - "💻 Workstations"
    #       - "📱🔐 Personal mobile devices"

controls:
  ###########################################################
  # Uncomment when you are ready to migrate Macs to Fleet
  # from a different MDM server, especially devices running
  # macOS ≤v26.
  #
  # For more information about what this does, see:
  #   • https://fleetdm.com/docs/configuration/yaml-files#macos-migration
  #   • https://fleetdm.com/guides/mdm-migration#end-user-workflow
  #
  # Note: This is a global setting that cannot be applied per-fleet.
  ###########################################################
  # macos_migration:
  #   enable: true
  #   mode: voluntary # Start with "voluntary", then change this to "forced" closer to the deadline.
  #   webhook_url: "https://your-custom-webhook-or-one-provided-off-the-shelf-by-fleet-for-the-mdm-you-are-coming-from.example.com/webhooks/receive-from-fleet"
  #   # ^ When end users click "Migrate to Fleet", this webhook is triggered.
  #   # By convention it looks up the device and unmanages it in the old MDM,
  #   # then enrolls the device in Fleet.  Unsure?  Get help @ fleetdm.com/support.

  ###########################################################
  # Fleet's Windows MDM features, turned on.
  #
  # Read more:
  #   • https://fleetdm.com/guides/windows-mdm-setup
  ###########################################################
  windows_enabled_and_configured: true


###########################################################
# Labels are static or dynamic groupings of computers for
# scoping, reporting, and more.  Use labels for everything
# from "x86 macs" to "finance department" to "needs new battery".
#
# For more, see:
#   • https://fleetdm.com/docs/configuration/yaml-files#labels
#   • https://fleetdm.com/guides/managing-labels-in-fleet
#
# (Optional) You can choose to manage labels in the Fleet GUI
# instead of in your git repo by **commenting out** `labels`
# below and removing the `labels/` folder.
#
# > Note: If you exclude `labels` from your git repo, then any
# > AI-assisted tools you may be using like Claude/Copilot/Kilocode
# > won't be able to see them as easily for use in scoping,
# > and could make it harder to do prompts like, for example:
# > "Make sure everyone in finance has the latest version of Excel"
###########################################################
labels:
  - paths: ./labels/*.yml
